<svg viewBox="0 0 500 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B3A6B"/>
      <stop offset="100%" stop-color="#0F2545"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F2C94C"/>
      <stop offset="100%" stop-color="#C99A2E"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6FC7E8"/>
      <stop offset="100%" stop-color="#2E86AB"/>
    </linearGradient>
  </defs>

  <!-- Outer shield -->
  <path d="M250 30
           L410 90
           L410 260
           C410 380 340 460 250 500
           C160 460 90 380 90 260
           L90 90
           Z"
        fill="url(#navyGrad)" stroke="url(#goldGrad)" stroke-width="8"/>

  <!-- Inner shield border -->
  <path d="M250 55
           L388 108
           L388 258
           C388 366 326 438 250 474
           C174 438 112 366 112 258
           L112 108
           Z"
        fill="none" stroke="#F2C94C" stroke-width="2.5" opacity="0.55"/>

  <!-- Globe / laurel arc suggesting "International" -->
  <circle cx="250" cy="230" r="95" fill="none" stroke="#F2C94C" stroke-width="2" opacity="0.35"/>
  <ellipse cx="250" cy="230" rx="95" ry="35" fill="none" stroke="#F2C94C" stroke-width="1.5" opacity="0.3"/>
  <ellipse cx="250" cy="230" rx="40" ry="95" fill="none" stroke="#F2C94C" stroke-width="1.5" opacity="0.3"/>

  <!-- Open book base -->
  <path d="M150 300 Q250 275 350 300 L350 320 Q250 295 150 320 Z" fill="url(#goldGrad)"/>
  <path d="M150 300 Q250 275 250 275 L250 315 Q150 320 150 320 Z" fill="#EFEFEF" opacity="0.9"/>
  <path d="M350 300 Q250 275 250 275 L250 315 Q350 320 350 320 Z" fill="#EFEFEF" opacity="0.9"/>
  <line x1="180" y1="288" x2="230" y2="282" stroke="#8FA0B3" stroke-width="2"/>
  <line x1="185" y1="298" x2="232" y2="292" stroke="#8FA0B3" stroke-width="2"/>
  <line x1="270" y1="282" x2="320" y2="288" stroke="#8FA0B3" stroke-width="2"/>
  <line x1="268" y1="292" x2="315" y2="298" stroke="#8FA0B3" stroke-width="2"/>

  <!-- Rising spring / fountain (Springwell emblem) -->
  <g>
    <path d="M250 270
             C250 240 235 225 250 195
             C265 225 250 240 250 270 Z" fill="url(#waterGrad)"/>
    <path d="M250 250
             C250 220 225 200 250 155
             C275 200 250 220 250 250 Z" fill="url(#waterGrad)" opacity="0.9"/>
    <path d="M250 235
             C250 195 208 170 250 110
             C292 170 250 195 250 235 Z" fill="url(#waterGrad)" opacity="0.85"/>
    <!-- droplets -->
    <circle cx="205" cy="150" r="7" fill="url(#waterGrad)" opacity="0.8"/>
    <circle cx="295" cy="150" r="7" fill="url(#waterGrad)" opacity="0.8"/>
    <circle cx="250" cy="95" r="8" fill="#F2C94C"/>
  </g>

  <!-- Ribbon banner -->
  <path d="M60 500 L440 500 L410 535 L440 570 L60 570 L90 535 Z" fill="url(#goldGrad)" stroke="#0F2545" stroke-width="2"/>

  <!-- School name -->
  <text x="250" y="405" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#F5F7FA" font-weight="bold" letter-spacing="2">SPRINGWELL</text>
  <text x="250" y="440" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#F2C94C" letter-spacing="4">INTERNATIONAL SCHOOL</text>

  <!-- Motto on ribbon -->
  <text x="250" y="542" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#0F2545" font-style="italic" letter-spacing="1">Wisdom Flows, Excellence Grows</text>
</svg>
