<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    * {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }
    header {
      background: blue;
      display: flex;
      justify-content: space-between;
      padding: 15px;
    }
    h3 {
      color: white;
      font-weight: bolder;
      text-transform: uppercase;
    }
    ul {
      list-style: none;
      display: flex;
      gap: 15px;
    }
    a {
      color: white;
      text-decoration: none;
    }
    #menuBtn {
      display: none;
      background: white;
      padding: 8px;
      border-radius: 5px;
      border: none;
      cursor: pointer;
    }
    @media screen and (min-width: 300px) and (max-width: 678px) {
      #menuBtn {
        display: block;
      }
      .menu-items {
        display: none;
        position: absolute;
        top: 60px;
        right: 0;
        width: 100%;
        background: rgba(0, 0, 0, 0.8);
        backdrop-filter: blur(3px);
      }
      .menu-items.active {
        display: block;
      }
    }
  </style>
  <body>
    <header>
      <div>
        <h3>Logo</h3>
      </div>
      <div>
        <nav>
          <ul class="menu-items">
            <li><a href="">Home</a></li>
            <li><a href="">About</a></li>
            <li><a href="">Contact</a></li>
          </ul>
        </nav>
        <button id="menuBtn">Menu</button>
      </div>
    </header>

    <script>
      const menuItems = document.querySelector(".menu-items");
      const menuBtn = document.getElementById("menuBtn");

      menuBtn.addEventListener("dblclick", () => {
        menuItems.classList.toggle("active");
      });
    </script>
  </body>
</html>
